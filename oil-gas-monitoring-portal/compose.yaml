services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: oilgas
      POSTGRES_USER: oilgas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilgas -d oilgas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    ports: ["127.0.0.1:8805:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata:
